services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Ocular\Chatbot\:
    resource: "../Classes/*"
    exclude: "../Classes/Domain/Model/*"

  # Voyage AI - generates embeddings for search queries
  LLPhant\Embeddings\EmbeddingGenerator\VoyageAI\Voyage4EmbeddingGenerator: ~

  # Qdrant config - connection settings
  Qdrant\Config:
    arguments:
      $host: "qdrant"
      $port: 6333

  # Qdrant - vector database connection
  LLPhant\Embeddings\VectorStores\Qdrant\QdrantVectorStore:
    arguments:
      $config: '@Qdrant\Config'
      $collectionName: "ocular_chunks"

  # Groq - LLM that generates the final answer
  LLPhant\Chat\OpenAIChat:
    arguments:
      $config: '@LLPhant\OpenAIConfig'

  LLPhant\OpenAIConfig:
    arguments:
      $apiKey: "%env(GROQ_API_KEY)%"
      $url: "https://api.groq.com/openai/v1/"
      $model: "llama-3.1-8b-instant"
